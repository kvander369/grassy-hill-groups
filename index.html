<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grassy Hill – Tee Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --forest: #1B4332;
    --forest-light: #2D6A4F;
    --sage: #52796F;
    --sage-light: #84A98C;
    --cream: #F8F6F0;
    --cream-dark: #EDE8DD;
    --warm-white: #FDFCF9;
    --gold: #C9A84C;
    --gold-light: #F1E8C8;
    --charcoal: #2F2F2F;
    --text: #3D3D3D;
    --text-muted: #7A7A7A;
    --border: #E2DED5;
    --red-soft: #B44040;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== HEADER ===== */
  header {
    background: var(--forest);
    color: var(--cream);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(27,67,50,0.3);
  }

  .header-inner {
    max-width: 680px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .header-logo {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.25);
    background: white;
  }

  .header-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.3px;
  }

  .header-sub {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sage-light);
  }

  .settings-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--cream);
    font-size: 16px;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
    line-height: 1;
  }

  .settings-btn:hover { background: rgba(255,255,255,0.2); }

  /* ===== CONTAINER ===== */
  .container { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; }

  /* ===== CARDS ===== */
  .card {
    background: var(--warm-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 16px;
  }

  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--forest);
    margin-bottom: 16px;
    letter-spacing: 0.2px;
  }

  /* ===== ROSTER ===== */
  .roster-actions {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--sage);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    letter-spacing: 0.3px;
    transition: color 0.15s;
  }

  .link-btn:hover { color: var(--forest); }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 4px;
  }

  .player-row {
    display: flex;
    align-items: center;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    border: 1px solid transparent;
  }

  .player-row:hover { background: var(--cream); }

  .player-row.checked {
    background: var(--gold-light);
    border-color: var(--gold);
  }

  .player-row input[type="checkbox"] {
    width: 17px;
    height: 17px;
    margin-right: 10px;
    accent-color: var(--forest);
    cursor: pointer;
    flex-shrink: 0;
  }

  .player-name {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    color: var(--charcoal);
  }

  .player-hcp {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    min-width: 24px;
    text-align: right;
    letter-spacing: 0.3px;
  }

  .checked-count {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--forest);
    color: var(--cream);
    font-weight: 700;
    font-size: 15px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
  }

  /* ===== ADD PLAYER ===== */
  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .add-row input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    background: var(--cream);
    color: var(--text);
    transition: border-color 0.15s;
  }

  .add-row input:focus { outline: none; border-color: var(--sage); }
  .add-row .hcp-input { width: 64px; flex: none; text-align: center; }

  /* ===== BUTTONS ===== */
  .btn {
    padding: 11px 22px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-primary {
    background: var(--forest);
    color: var(--cream);
  }

  .btn-primary:hover { background: var(--forest-light); }
  .btn-primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  .btn-secondary {
    background: var(--warm-white);
    color: var(--forest);
    border: 1.5px solid var(--forest);
  }

  .btn-secondary:hover { background: var(--cream); }

  .btn-add {
    background: var(--sage);
    color: var(--cream);
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }

  .btn-add:hover { background: var(--forest-light); }

  /* ===== GROUP SIZE ===== */
  .size-options { display: flex; gap: 12px; }

  .size-option {
    flex: 1;
    padding: 18px 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--warm-white);
  }

  .size-option:hover { border-color: var(--sage-light); }

  .size-option.selected {
    border-color: var(--forest);
    background: linear-gradient(to bottom, var(--warm-white), var(--cream));
    box-shadow: 0 0 0 1px var(--forest);
  }

  .size-option .num {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    color: var(--forest);
    line-height: 1;
  }

  .size-option .label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  /* ===== SPLIT OPTIONS ===== */
  .split-options { display: flex; flex-direction: column; gap: 8px; }

  .split-option {
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.15s;
    background: var(--warm-white);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .split-option:hover { border-color: var(--sage-light); }

  .split-option.selected {
    border-color: var(--forest);
    background: var(--cream);
    box-shadow: 0 0 0 1px var(--forest);
  }

  .split-desc { font-size: 13px; color: var(--text-muted); }

  /* ===== GENERATE ===== */
  .generate-section { padding: 4px 0 8px; }

  .btn-generate {
    width: 100%;
    padding: 18px;
    font-size: 16px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border-radius: var(--radius);
  }

  /* ===== RESULTS ===== */
  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .option-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 4px;
  }

  .option-tab {
    flex: 1;
    padding: 10px 16px;
    text-align: center;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
    background: transparent;
    color: var(--text-muted);
    border: none;
    border-radius: 6px;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .option-tab.active {
    background: var(--forest);
    color: var(--cream);
    box-shadow: var(--shadow-sm);
  }

  .option-content { display: none; }
  .option-content.active { display: block; }

  .group-card {
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
    margin-bottom: 10px;
    border-left: 3px solid var(--gold);
    position: relative;
  }

  .group-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--sage);
    margin-bottom: 8px;
  }

  .group-players { font-size: 15px; line-height: 1; }

  .group-players .player-entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }

  .group-players .player-entry:last-child { border-bottom: none; }

  .group-players .p-name { font-weight: 500; color: var(--charcoal); }
  .group-players .p-hcp { color: var(--text-muted); font-size: 13px; font-weight: 600; }

  .result-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .result-actions .btn { flex: 1; padding: 14px; }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--warm-white);
    border-radius: var(--radius);
    padding: 28px;
    width: 90%;
    max-width: 380px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }

  .modal h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 20px;
    color: var(--forest);
  }

  .modal label {
    font-size: 13px;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
    color: var(--text);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .modal input[type="number"] {
    width: 90px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-family: inherit;
    background: var(--cream);
  }

  .modal input[type="number"]:focus { outline: none; border-color: var(--sage); }

  .modal-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  }

  /* ===== STATUS ===== */
  .status {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 16px;
    display: none;
    border: 1px solid transparent;
  }

  .status.success {
    display: block;
    background: #E8F5E9;
    color: var(--forest);
    border-color: var(--sage-light);
  }

  .status.error {
    display: block;
    background: #FFF3F0;
    color: var(--red-soft);
    border-color: #E8B4B4;
  }

  .hidden { display: none !important; }

  @media (max-width: 500px) {
    .roster-grid { grid-template-columns: 1fr; }
    .header-sub { display: none; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-brand">
      <img src="ghlogo.png" alt="GHWGA Golf" class="header-logo">
      <div class="header-text">
        <h1>GHWGA</h1>
        <span class="header-sub">Tee Sheet</span>
      </div>
    </div>
    <button class="settings-btn" onclick="openSettings()" title="Settings">⚙</button>
  </div>
</header>

<div class="container">

  <div id="status" class="status"></div>

  <!-- Roster -->
  <div class="card">
    <div class="card-title">Who's Playing Today?</div>
    <div class="roster-actions">
      <button class="link-btn" onclick="selectAll()">Select All</button>
      <button class="link-btn" onclick="deselectAll()">Clear</button>
    </div>
    <div id="roster" class="roster-grid"></div>
    <div id="checkedCount" class="checked-count"></div>
    <div class="add-row">
      <input type="text" id="newName" placeholder="Add a player…">
      <input type="number" id="newHcp" class="hcp-input" placeholder="Hcp">
      <button class="btn-add" onclick="addPlayer()">Add</button>
    </div>
  </div>

  <!-- Group Size -->
  <div class="card">
    <div class="card-title">Group Size</div>
    <div class="size-options">
      <div class="size-option" onclick="selectSize(2)" data-size="2">
        <div class="num">2</div>
        <div class="label">Twosomes</div>
      </div>
      <div class="size-option" onclick="selectSize(3)" data-size="3">
        <div class="num">3</div>
        <div class="label">Threesomes</div>
      </div>
      <div class="size-option" onclick="selectSize(4)" data-size="4">
        <div class="num">4</div>
        <div class="label">Foursomes</div>
      </div>
    </div>
  </div>

  <!-- Split Options -->
  <div id="splitCard" class="card hidden">
    <div class="card-title">Choose Your Split</div>
    <div id="splitOptions" class="split-options"></div>
  </div>

  <!-- Generate -->
  <div class="generate-section">
    <button id="generateBtn" class="btn btn-primary btn-generate" onclick="generateGroups()" disabled>
      Generate Groups
    </button>
  </div>

  <!-- Results -->
  <div id="resultsCard" class="card hidden">
    <div class="card-title" style="margin-bottom:16px">Today's Groups</div>
    <div class="option-tabs">
      <button class="option-tab active" onclick="showOption(0)">Option A</button>
      <button class="option-tab" onclick="showOption(1)">Option B</button>
    </div>
    <div id="optionA" class="option-content active"></div>
    <div id="optionB" class="option-content"></div>
    <div class="result-actions">
      <button class="btn btn-secondary" onclick="generateGroups()">Generate More</button>
      <button class="btn btn-primary" onclick="saveRound()">Use This One</button>
    </div>
  </div>

</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal">
    <h2>Settings</h2>
    <label for="lookbackInput">Lookback Window</label>
    <input type="number" id="lookbackInput" min="1" max="52" value="6">
    <p class="modal-hint">
      How many weeks of history the algorithm considers when mixing up groups and tee time positions.
    </p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeSettings()" style="padding:10px 20px">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()" style="padding:10px 20px">Save</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lackcooiarpahgmkrpeu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tJiFVeYxpyuARtzVn41u-Q_1zkILqdF';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let players = [];
let checkedIds = new Set();
let selectedSize = null;
let selectedSplit = null;
let lookbackWeeks = 6;
let historyData = null;
let currentOptions = [null, null];
let activeOption = 0;

async function init() {
  await loadSettings();
  await loadPlayers();
  updateCheckedCount();
}

async function loadPlayers() {
  const { data, error } = await sb.from('players').select('*').order('name');
  if (error) return showStatus('Error loading roster: ' + error.message, 'error');
  players = data;
  renderRoster();
}

async function loadSettings() {
  const { data } = await sb.from('settings').select('*').eq('key', 'lookback_weeks').single();
  if (data) {
    lookbackWeeks = parseInt(data.value);
    document.getElementById('lookbackInput').value = lookbackWeeks;
  }
}

async function loadHistory() {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - lookbackWeeks * 7);
  const cutoffStr = cutoff.toISOString().split('T')[0];

  const { data: rounds } = await sb.from('rounds').select('id, played_date, group_size')
    .gte('played_date', cutoffStr).order('played_date', { ascending: false });

  if (!rounds || rounds.length === 0) return { pairCounts: {}, positionCounts: {} };

  const roundIds = rounds.map(r => r.id);
  const { data: groups } = await sb.from('round_groups').select('round_id, group_number, player_id')
    .in('round_id', roundIds);

  const pairCounts = {};
  const positionCounts = {};
  const byRound = {};

  for (const g of groups) {
    if (!byRound[g.round_id]) byRound[g.round_id] = {};
    if (!byRound[g.round_id][g.group_number]) byRound[g.round_id][g.group_number] = [];
    byRound[g.round_id][g.group_number].push(g.player_id);
  }

  for (const roundId in byRound) {
    const round = byRound[roundId];
    const groupNums = Object.keys(round).map(Number).sort((a,b) => a - b);
    const total = groupNums.length;

    for (const gNum of groupNums) {
      const members = round[gNum];
      const normPos = total > 1 ? Math.round((gNum - 1) / (total - 1) * 2) : 1;

      for (let i = 0; i < members.length; i++) {
        const posKey = members[i] + ':' + normPos;
        positionCounts[posKey] = (positionCounts[posKey] || 0) + 1;

        for (let j = i + 1; j < members.length; j++) {
          const key = [members[i], members[j]].sort().join('|');
          pairCounts[key] = (pairCounts[key] || 0) + 1;
        }
      }
    }
  }

  return { pairCounts, positionCounts };
}

function renderRoster() {
  document.getElementById('roster').innerHTML = players.map(p => `
    <label class="player-row ${checkedIds.has(p.id) ? 'checked' : ''}" data-id="${p.id}">
      <input type="checkbox" ${checkedIds.has(p.id) ? 'checked' : ''} onchange="togglePlayer('${p.id}')">
      <span class="player-name">${p.name}</span>
      <span class="player-hcp">${p.handicap != null ? p.handicap : '–'}</span>
    </label>
  `).join('');
}

function togglePlayer(id) {
  if (checkedIds.has(id)) checkedIds.delete(id); else checkedIds.add(id);
  renderRoster(); updateCheckedCount(); updateSplitOptions();
}

function selectAll() { players.forEach(p => checkedIds.add(p.id)); renderRoster(); updateCheckedCount(); updateSplitOptions(); }
function deselectAll() { checkedIds.clear(); renderRoster(); updateCheckedCount(); updateSplitOptions(); }

function updateCheckedCount() {
  const n = checkedIds.size;
  document.getElementById('checkedCount').innerHTML = n === 0
    ? '<span style="color:var(--text-muted)">Tap names to check in players</span>'
    : `<span class="count-num">${n}</span> player${n !== 1 ? 's' : ''} checked in`;
  updateGenerateButton();
}

async function addPlayer() {
  const nameEl = document.getElementById('newName');
  const hcpEl = document.getElementById('newHcp');
  const name = nameEl.value.trim();
  const hcp = hcpEl.value ? parseFloat(hcpEl.value) : null;
  if (!name) return;

  const { data, error } = await sb.from('players').insert({ name, handicap: hcp }).select().single();
  if (error) {
    if (error.message.includes('unique')) return showStatus(name + ' is already on the roster.', 'error');
    return showStatus('Error: ' + error.message, 'error');
  }

  players.push(data);
  players.sort((a, b) => a.name.localeCompare(b.name));
  checkedIds.add(data.id);
  renderRoster(); updateCheckedCount();
  nameEl.value = ''; hcpEl.value = '';
  showStatus(name + ' added to roster and checked in.', 'success');
}

function selectSize(size) {
  selectedSize = size;
  document.querySelectorAll('.size-option').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.size) === size);
  });
  updateSplitOptions(); updateGenerateButton();
}

function updateSplitOptions() {
  const n = checkedIds.size;
  const splitCard = document.getElementById('splitCard');
  const splitEl = document.getElementById('splitOptions');

  if (!selectedSize || n === 0) { splitCard.classList.add('hidden'); selectedSplit = null; return; }

  const remainder = n % selectedSize;
  if (remainder === 0) {
    selectedSplit = Array(n / selectedSize).fill(selectedSize);
    splitCard.classList.add('hidden'); updateGenerateButton(); return;
  }

  const splits = generateSplits(n, selectedSize);
  if (splits.length <= 1) { selectedSplit = splits[0]; splitCard.classList.add('hidden'); updateGenerateButton(); return; }

  splitCard.classList.remove('hidden');
  splitEl.innerHTML = splits.map((split, i) => {
    const desc = split.join(' – ');
    return `<div class="split-option ${selectedSplit && splitMatch(selectedSplit, split) ? 'selected' : ''}"
                 onclick="chooseSplit(${i})">
              <strong>${desc}</strong>
              <span class="split-desc">${describeSplit(split)}</span>
            </div>`;
  }).join('');
  window._splits = splits;
}

function generateSplits(n, size) {
  if (n % size === 0) return [Array(n / size).fill(size)];

  const results = [];
  const fullGroups = Math.floor(n / size);
  const leftover = n % size;

  // Option A: max full groups + short group (if short >= 2)
  if (leftover >= 2) {
    const s = Array(fullGroups).fill(size);
    s.push(leftover);
    s.sort((a,b) => b - a);
    results.push(s);
  }

  // Option B: even distribution using groups of size and (size-1)
  // x*size + y*(size-1) = n, x+y = totalGroups
  // solving: y = totalGroups*size - n, x = totalGroups - y
  const totalGroups = Math.ceil(n / size);
  const numSmall = totalGroups * size - n;
  const numBig = totalGroups - numSmall;

  if (numBig >= 0 && numSmall >= 0 && (size - 1) >= 2) {
    const s = [];
    for (let i = 0; i < numBig; i++) s.push(size);
    for (let i = 0; i < numSmall; i++) s.push(size - 1);
    if (s.reduce((a,b) => a+b, 0) === n) {
      s.sort((a,b) => b - a);
      results.push(s);
    }
  }

  // Deduplicate
  const seen = new Set();
  return results.filter(s => {
    const k = s.join(',');
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}

function describeSplit(split) {
  const c = {};
  for (const s of split) c[s] = (c[s] || 0) + 1;
  return Object.entries(c).sort((a,b) => b[0] - a[0])
    .map(([s, n]) => `${n} ${['','','twosome','threesome','foursome'][s]}${n > 1 ? 's' : ''}`).join(', ');
}

function chooseSplit(i) {
  selectedSplit = window._splits[i];
  document.querySelectorAll('.split-option').forEach((el, j) => el.classList.toggle('selected', j === i));
  updateGenerateButton();
}

function splitMatch(a, b) { return a.length === b.length && a.every((v, i) => v === b[i]); }

function updateGenerateButton() {
  document.getElementById('generateBtn').disabled = !(checkedIds.size >= 2 && selectedSize && selectedSplit);
}

async function generateGroups() {
  const btn = document.getElementById('generateBtn');
  btn.textContent = 'GENERATING…'; btn.disabled = true;
  showStatus('', '');

  try {
    historyData = await loadHistory();
    const activePlayers = players.filter(p => checkedIds.has(p.id));
    const split = [...selectedSplit];
    const scored = [];

    for (let a = 0; a < 2000; a++) {
      const shuffled = [...activePlayers].sort(() => Math.random() - 0.5);
      const groups = []; let idx = 0;
      for (let g = 0; g < split.length; g++) {
        groups.push({ groupNumber: g + 1, players: shuffled.slice(idx, idx + split[g]) });
        idx += split[g];
      }
      scored.push({ groups, score: scoreGrouping(groups, historyData) });
    }

    scored.sort((a, b) => a.score - b.score);
    currentOptions[0] = scored[0];
    currentOptions[1] = scored[1];

    for (let i = 1; i < scored.length; i++) {
      if (groupingDiff(scored[0].groups, scored[i].groups) > 0.3) { currentOptions[1] = scored[i]; break; }
    }

    renderResults();
  } catch (err) { showStatus('Error: ' + err.message, 'error'); }

  btn.textContent = 'GENERATE GROUPS'; btn.disabled = false;
}

function scoreGrouping(groups, history) {
  const { pairCounts, positionCounts } = history;
  let ps = 0, pos = 0;
  const total = groups.length;

  for (const g of groups) {
    const m = g.players;
    const np = total > 1 ? Math.round((g.groupNumber - 1) / (total - 1) * 2) : 1;

    for (let i = 0; i < m.length; i++) {
      pos += (positionCounts[m[i].id + ':' + np] || 0);
      for (let j = i + 1; j < m.length; j++) {
        ps += (pairCounts[[m[i].id, m[j].id].sort().join('|')] || 0);
      }
    }
  }
  // Small jitter prevents the algorithm from always converging to identical placements
  return ps * 3 + pos + Math.random() * 2;
}

function groupingDiff(g1, g2) {
  const p1 = new Set(), p2 = new Set();
  for (const g of g1) for (let i = 0; i < g.players.length; i++) for (let j = i+1; j < g.players.length; j++)
    p1.add([g.players[i].id, g.players[j].id].sort().join('|'));
  for (const g of g2) for (let i = 0; i < g.players.length; i++) for (let j = i+1; j < g.players.length; j++)
    p2.add([g.players[i].id, g.players[j].id].sort().join('|'));
  let o = 0; for (const p of p1) if (p2.has(p)) o++;
  return 1 - o / Math.max(p1.size, p2.size, 1);
}

function renderResults() {
  document.getElementById('resultsCard').classList.remove('hidden');

  for (let opt = 0; opt < 2; opt++) {
    const el = document.getElementById(opt === 0 ? 'optionA' : 'optionB');
    const { groups } = currentOptions[opt];
    el.innerHTML = groups.map(g => `
      <div class="group-card">
        <div class="group-label">Group ${g.groupNumber} of ${groups.length}</div>
        <div class="group-players">
          ${g.players.map(p => `
            <div class="player-entry">
              <span class="p-name">${p.name}</span>
              <span class="p-hcp">${p.handicap != null ? p.handicap : '–'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }
  showOption(0);
  document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth' });
}

function showOption(i) {
  activeOption = i;
  document.querySelectorAll('.option-tab').forEach((t, j) => t.classList.toggle('active', j === i));
  document.querySelectorAll('.option-content').forEach((e, j) => e.classList.toggle('active', j === i));
}

async function saveRound() {
  const option = currentOptions[activeOption];
  if (!option) return;
  const today = new Date().toISOString().split('T')[0];

  const { data: existing } = await sb.from('rounds').select('id').eq('played_date', today).eq('format_name', 'Generated');
  if (existing && existing.length > 0) {
    if (!confirm('Replace today\'s existing groups with this selection?')) return;
    for (const old of existing) {
      await sb.from('rounds').delete().eq('id', old.id);
    }
  }

  const { data: round, error: re } = await sb.from('rounds')
    .insert({ played_date: today, format_name: 'Generated', group_size: selectedSize }).select().single();
  if (re) return showStatus('Error saving: ' + re.message, 'error');

  const inserts = [];
  for (const g of option.groups) for (const p of g.players)
    inserts.push({ round_id: round.id, group_number: g.groupNumber, player_id: p.id, handicap: p.handicap });

  const { error: ge } = await sb.from('round_groups').insert(inserts);
  if (ge) return showStatus('Error saving groups: ' + ge.message, 'error');

  historyData = null;

  // Visual feedback on the button itself
  const saveBtn = document.querySelector('.result-actions .btn-primary');
  saveBtn.textContent = '✅ Saved!';
  saveBtn.style.background = 'var(--sage)';
  saveBtn.disabled = true;
  setTimeout(() => {
    saveBtn.textContent = 'Use This One';
    saveBtn.style.background = '';
    saveBtn.disabled = false;
  }, 3000);
}

function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }

async function saveSettings() {
  const val = document.getElementById('lookbackInput').value;
  lookbackWeeks = parseInt(val);
  await sb.from('settings').update({ value: val.toString(), updated_at: new Date().toISOString() }).eq('key', 'lookback_weeks');
  historyData = null; closeSettings();
  showStatus('Lookback set to ' + lookbackWeeks + ' weeks.', 'success');
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.className = 'status' + (type ? ' ' + type : ''); el.textContent = msg;
  if (type === 'success') setTimeout(() => { el.className = 'status'; el.textContent = ''; }, 4000);
}

init();
</script>
